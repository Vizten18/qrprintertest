name: qrprintertest
description: A Very Good Project created by Very Good CLI.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ^3.44.0

dependencies:
  bloc: ^9.2.1
  bonsoir: ^7.1.6
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  image: ^4.12.0
  intl: ^0.20.2
  qr: ^4.0.0
dev_dependencies:
  bloc_lint: ^0.4.1
  bloc_test: ^10.0.0
  bloc_tools: ^0.1.0-dev.24
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^10.3.0

flutter:
  config:
    # `nitro` (dependencia de nitro_printing) solo soporta SPM en iOS/macOS.
    enable-swift-package-manager: true
  generate: true
  uses-material-design: true
